let current=0;
let answers=new Array(questions.length).fill(null);
let submitted=false;

function render(){
 let q=questions[current];
 document.getElementById("number").innerText=current+1;
 document.getElementById("topic").innerText="📖 "+q.t;
 document.getElementById("question").innerText=
 "Q"+(current+1)+". "+q.q;
 document.getElementById("options").innerHTML="";
 q.o.forEach((op,i)=>{
 let label=document.createElement("label");
 label.className="option"+(answers[current]===i?" selected":"");
 label.innerHTML=`<input type="radio" name="answer" ${answers[current]===i?"checked":""}> ${String.fromCharCode(65+i)}. ${op}`;
 label.onclick=()=>{
 answers[current]=i;
 render();
 };
 document.getElementById("options").appendChild(label);
 });
 document.getElementById("live").innerText=
 answers.filter((a,i)=>questions[i].a!==null && a===questions[i].a).length;
 document.getElementById("bar").style.width=
 ((current+1)/questions.length*100)+"%";
}

function next(){
 if(current<questions.length-1){current++;render();}
 else alert("यह अंतिम प्रश्न है। टेस्ट सबमिट करें।");
}

function previous(){
 if(current>0){current--;render();}
}

function submitTest(){
 if(submitted)return;
 let blank=answers.filter(a=>a===null).length;
 if(!confirm("क्या आप टेस्ट सबमिट करना चाहते हैं? अनुत्तरित प्रश्न: "+blank))return;
 submitted=true;

 let right=0,wrong=0,skip=0;
 questions.forEach((q,i)=>{
 if(q.a===null){
   if(answers[i]===null)skip++;
   return;
 }
 if(answers[i]===q.a)right++;
 else if(answers[i]!==null)wrong++;
 else skip++;
 });

 let percent=Math.round(right/(questions.length-2)*100);
 document.getElementById("quiz").classList.add("hide");
 document.getElementById("result").classList.remove("hide");
 document.getElementById("percentage").innerText=percent+"%";
 document.getElementById("score").innerText=
 "✅ सही उत्तर: "+right+" / 30";
 document.getElementById("wrong").innerText=
 "❌ गलत उत्तर: "+wrong;
 document.getElementById("skip").innerText=
 "⏭ छोड़े गए GK प्रश्न: "+(30-right-wrong);
}

function showReview(){
 document.getElementById("result").classList.add("hide");
 document.getElementById("review").classList.remove("hide");
 let html="";
 questions.forEach((q,i)=>{
 let status=q.a===null?"special":(answers[i]===q.a?"correct":"wrong");
 html+=`<div class="review">
 <b>Q${i+1}. ${q.q}</b><br><br>
 आपका उत्तर: <span class="${status}">${answers[i]===null?"नहीं दिया":q.o[answers[i]]}</span><br>`;
 if(q.a!==null){
 html+=`सही उत्तर: <span class="correct">${q.o[q.a]}</span><br>`;
 }
 html+=`<br><b>व्याख्या:</b> ${q.e}</div>`;
 });
 document.getElementById("reviewContent").innerHTML=html;
}

render();
</script>
</body>
</html>
